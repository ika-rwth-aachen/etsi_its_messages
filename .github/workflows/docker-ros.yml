name: docker-ros

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  ros2-humble:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: ika-rwth-aachen/docker-ros@main
        with:
          platform: amd64
          target: run
          image-tag: humble
          base-image: rwthika/ros2:humble
          command: ros2 launch etsi_its_conversion converter.launch.py
          enable-recursive-vcs-import: 'false'

  ros2-jazzy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: ika-rwth-aachen/docker-ros@main
        with:
          platform: amd64
          target: run
          image-tag: jazzy
          base-image: rwthika/ros2:jazzy
          rmw-implementation: rmw_zenoh_cpp
          command: ros2 launch etsi_its_conversion converter.launch.py
          enable-recursive-vcs-import: 'false'

  ros2-kilted:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: ika-rwth-aachen/docker-ros@main
        with:
          platform: amd64
          target: run
          image-tag: kilted
          base-image: rwthika/ros2:kilted
          rmw-implementation: rmw_zenoh_cpp
          command: ros2 launch etsi_its_conversion converter.launch.py
          enable-recursive-vcs-import: 'false'

  ros2-lyrical:
    runs-on: ubuntu-latest
    steps:
      - uses: ika-rwth-aachen/docker-ros@main
        with:
          platform: amd64
          target: run
          image-tag: lyrical
          enable-push-as-latest: 'true'
          base-image: ros:lyrical-ros-base # TODO: rwthika/ros2:lyrical
          rmw-implementation: rmw_zenoh_cpp
          command: ros2 launch etsi_its_conversion converter.launch.py
          enable-recursive-vcs-import: 'false'
